[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.20"
optimizer = true
optimizer_runs = 200

[rpc_endpoints]
coston2 = "https://coston2-api.flare.network/ext/C/rpc"
flare_mainnet = "https://flare-api.flare.network/ext/C/rpc"

[etherscan]
coston2 = { key = "${COSTON2_API_KEY}", url = "https://coston2-explorer.flare.network/api" }
